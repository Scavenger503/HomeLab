apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - eyJhIjoiOWY1NDU1NTAxODM5YzFlYjEzNzc2ODgyNGUyODg5YjUiLCJ0IjoiMWMyMzk5YzAtNjI2Zi00Njk0LTk5ZmEtMjNjMmE0MDIyZDUzIiwicyI6IlptVTJNR1V5TkdFdFpXRXlZeTAwWVdaakxUZzFZekl0WlRWaU5tWXpNelJoTW1KbCJ9
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"

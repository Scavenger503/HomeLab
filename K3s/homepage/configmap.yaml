apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-custom-css
  namespace: homepage
data:
  custom.css: |
    /* Section headers */
    #page-container h1, #page-container h2, .service-group h2 {
      color: #ff2020 !important;
      font-family: monospace !important;
      text-transform: uppercase !important;
      letter-spacing: 0.1em !important;
    }

    /* Service cards */
    .service {
      background-color: rgba(0, 0, 0, 0.6) !important;
      border: 1px solid #ff2020 !important;
      border-radius: 4px !important;
    }

    /* Service card hover */
    .service:hover {
      border-color: #ff4444 !important;
      box-shadow: 0 0 8px rgba(255, 32, 32, 0.4) !important;
    }

    /* Service name text */
    .service-name {
      color: #ffffff !important;
      font-family: monospace !important;
    }

    /* Service description */
    .service-description {
      color: #aaaaaa !important;
      font-family: monospace !important;
    }

    /* Response time pill (top right of card) */
    .service-tag {
      color: #ff2020 !important;
      font-size: 0.7em !important;
    }

    /* Top stats bar */
    #information-widgets {
      color: #ffffff !important;
      font-family: monospace !important;
    }

    /* Search bar */
    #search-bar input {
      background-color: rgba(0,0,0,0.7) !important;
      border: 1px solid #ff2020 !important;
      color: #ffffff !important;
    }
